experiment_name: china_doha_to_nigeria_resnet18
setting: source_only

workdir: /media/share/Member/ueki/datasets

sources:
  - name: china
    path: ZhangLabData_binary_dataset
  - name: doha
    path: COVID-19_Radiography_binary_dataset_clean

target:
  name: nigeria
  path: nigerian_pneumonia_binary_dataset

classes:
  - NORMAL
  - PNEUMONIA

positive_class: PNEUMONIA

train:
  batch_size: 128
  epochs: 30
  lr: 0.0001
  num_workers: 0
  img_size: 224
  beta1: 0.9
  beta2: 0.999

model:
  name: resnet18
  pretrained: true

visualization:
  enabled: true
  method: tsne
  max_samples_per_domain: 500
  use_split: test
  color_by:
    - domain
    - class
  checkpoint: checkpoints/best_model.pth
  output_dirname: feature_visualization

output_dir: outputs/china_doha_to_nigeria