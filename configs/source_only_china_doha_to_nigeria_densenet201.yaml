experiment_name: china_doha_to_nigeria_densenet201
setting: source_only

workdir: /media/share/Member/ueki/datasets

sources:
  - name: china
    path: ZhangLabData_binary_dataset
  - name: doha
    path: COVID-19_Radiography_binary_dataset_clean

target:
  name: nigeria
  path: nigerian_pneumonia_binary_dataset

classes:
  - NORMAL
  - PNEUMONIA

positive_class: PNEUMONIA

train:
  batch_size: 32
  epochs: 100
  lr: 0.001
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.0001
  num_workers: 0
  img_size: 224

scheduler:
  name: reduce_on_plateau
  factor: 0.1
  patience: 3

early_stopping:
  enabled: true
  patience: 10

model:
  name: densenet201
  pretrained: true
  freeze_features: true

output_dir: outputs/china_doha_to_nigeria_densenet201